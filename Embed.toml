[default.probe]
protocol = "Swd"
speed = 4000

[default.flashing]
enabled = true
halt_afterwards = false
restore_unwritten_bytes = false

[default.reset]
enabled = true
halt_afterwards = false

[default.general]
chip = "STM32H750IBKx"

[default.rtt]
# RTT is used by defmt for logging
enabled = true
up_mode = "BlockIfFull"

# Channel 0 is used by defmt
channels = [
    { up = 0, down = 0, name = "defmt", format = "Defmt" },
]

[default.gdb]
enabled = false
