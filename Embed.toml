[default.probe]
# Use the first found probe
protocol = "Swd"
speed = 4000

[default.flashing]
enabled = true
halt_afterwards = false

[default.reset]
enabled = true
halt_afterwards = false

[default.general]
chip = "STM32H750IBKx"

[default.rtt]
enabled = true
up_mode = "BlockIfFull"
channels = [
    { up = 0, down = 0, name = "Terminal", format = "String" },
]

[default.gdb]
enabled = false
