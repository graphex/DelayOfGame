[target.thumbv7em-none-eabihf]
# Use probe-rs for running/debugging
runner = "probe-rs run --chip STM32H750IBKx"

rustflags = [
  # Link with linker scripts
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tdefmt.x",
]

[build]
# Target for STM32H7 (Cortex-M7 with FPU)
target = "thumbv7em-none-eabihf"

[env]
# Set defmt logging level (trace, debug, info, warn, error)
DEFMT_LOG = "trace"
