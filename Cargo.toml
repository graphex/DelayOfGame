[package]
name = "delay-of-game"
version = "0.1.0"
edition = "2021"
authors = ["graphex"]
description = "Audio delay system for syncing Dave Logan Broncos commentary with TV broadcast"

[dependencies]
# Daisy Embassy - Modern async framework for Daisy boards
# Features: seed_1_1 (WM8731), seed_1_2 (PCM3060)
# NOTE: Only ONE codec feature should be active at a time
daisy-embassy = { version = "0.2.2", default-features = false }

# Embassy async runtime and HAL
embassy-stm32 = { version = "0.2.0", features = ["defmt", "stm32h750ib", "time-driver-tim5", "exti", "memory-x", "unstable-pac", "chrono"] }
embassy-time = { version = "0.4.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-sync = { version = "0.6.2", features = ["defmt"] }
embassy-executor = { version = "0.7.0", features = ["task-arena-size-32768", "arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-futures = "0.1.1"

# Core embedded dependencies
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { version = "0.7.0", features = ["device"] }
static_cell = "2.1.1"
critical-section = "1.2.0"

# Debug and logging
defmt = "0.3.8"
defmt-rtt = "0.4.1"
panic-probe = { version = "0.3.2", features = ["print-defmt"] }

# Utilities
heapless = { version = "0.8", default-features = false }
micromath = "2.0.0"

[dev-dependencies]

[profile.dev]
opt-level = 1
debug = true
lto = false

[profile.release]
opt-level = "s"     # Optimize for size
debug = true        # Keep debug info for probe-rs
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization

[[bin]]
name = "delay-of-game"
path = "src/main.rs"

[[example]]
name = "blink"
path = "examples/blink.rs"

[features]
# Only one codec feature should be enabled at a time
default = ["seed_1_1"]

# Codec options (mutually exclusive):
seed_1_1 = ["daisy-embassy/seed_1_1"]  # WM8731 codec (current board)
seed_1_2 = ["daisy-embassy/seed_1_2"]  # PCM3060 codec (future board)

# To switch codecs, use:
#   cargo build --release                              # Uses default (seed_1_1)
#   cargo build --release --no-default-features --features seed_1_2  # For PCM3060
